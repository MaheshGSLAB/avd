---
#Testing missing defined application-profile
fabric_name: FABRIC_WAN_ROUTER1
wan_mode: cv-pathfinder
type: wan_router
# Disabling underlay for tests
underlay_routing_protocol: none

bgp_as: 65000

cv_pathfinder_regions:
  - name: AVD_Land_West
    id: 42
    description: AVD Region
    sites:
      - name: Site422
        id: 422
        location: Somewhere

bgp_peer_groups:
  wan_overlay_peers:
    password: "htm4AZe9mIQOO1uiMuGgYQ=="
    listen_range_prefixes:
      - 192.168.255.0/24

wan_route_servers:
  - hostname: cv-pathfinder-pathfinder
    vtep_ip: 10.10.10.10
    path_groups:
      - name: INET
        interfaces:
          - name: Ethernet1
            public_ip: 192.168.55.55

wan_ipsec_profiles:
  control_plane:
    shared_key: ABCDEF1234567890
  data_plane:
    shared_key: ABCDEF1234567890666

default_node_types:
  - node_type: wan_router
    match_hostnames:
      - "missing-application-classification.*"

wan_router:
  defaults:
    loopback_ipv4_pool: 192.168.42.0/24
    vtep_loopback_ipv4_pool: 192.168.255.0/24
    filter:
      always_include_vrfs_in_tenants: [TenantA]
  nodes:
    - name: missing-wan-vni-in-wan-virtual-topologies-vrf
      id: 1
      l3_interfaces:
        - name: Ethernet1
          wan_carrier: ATT
          wan_circuit_id: 666
          dhcp_accept_default_route: true
          ip_address: dhcp

wan_path_groups:
  - name: INET
    id: 101

wan_carriers:
  - name: ATT
    path_group: INET
    trusted: true
wan_use_evpn_node_settings_for_lan: false
tenants:
  - name: TenantA
    vrfs:
      - name: VRF1
        vrf_id: 1
        address_families:
          - evpn
      - name: VRF2
        vrf_id: 42

wan_virtual_topologies:
  vrfs:
    - name: PROD
      wan_vni: 42
  policies:
    - name: DEFAULT-POLICY
      default_virtual_topology:
        drop_unmatched: true
      application_virtual_topologies:
        - application_profile: TEST
          id: 42
          path_groups:
            - names: [INET]

expected_error_message: >-
  The VRF 'VRF1' does not have a 'wan_vni' defined under 'wan_virtual_topologies'. If this VRF was not intended to be extended over the WAN, but still required to be configured on the WAN router, set 'address_families: []' under the VRF definition. If this VRF was not intended to be configured on the WAN router, use the VRF filter 'deny_vrfs' under the node settings for host 'missing-wan-vni-in-wan-virtual-topologies-vrf'.
