[tox]
env_list =
    py310
    py311
    py312
    coverage-part1
    coverage-part2
    report

depends =
    # The report now depends on BOTH parallel jobs completing successfully.
    report: coverage-part1, coverage-part2

[gh-actions]
python =
  3.10: py310
  # This will run part1 and part2 in parallel, then run the report.
  3.11: coverage-part1, coverage-part2, report
  3.12: py312
  3.13: py313

[testenv]
package = wheel
wheel_build_env = .pkg
dependency_groups =
    pytest
commands =
    # posargs allows to run only a specific test using
    # tox -e <env> -- path/to/my/test::test
    pytest {posargs}

[testenv:coverage-part1]
description = Run all tests except for a few specific ones.
dependency_groups =
    pytest
    coverage
commands =
    # Erase old data before starting the parallel run.
    coverage erase
    coverage run --rcfile=pyproject.toml -m pytest \
    --ignore=tests/pyavd/molecule_scenarios/test_get_device_config.py \
    --ignore=tests/pyavd/molecule_scenarios/test_get_device_doc.py \
    --ignore=tests/pyavd/molecule_scenarios/test_negative_eos_designs.py

[testenv:coverage-part2]
description = Run only the previously excluded tests.
dependency_groups =
    pytest
    coverage
commands =
    # REMOVED --append. It will now create its own unique data file.
    coverage run --rcfile=pyproject.toml -m pytest \
    tests/pyavd/molecule_scenarios/test_get_device_config.py \
    tests/pyavd/molecule_scenarios/test_get_device_doc.py \
    tests/pyavd/molecule_scenarios/test_negative_eos_designs.py

[testenv:report]
skip_install = true
dependency_groups =
    coverage
commands =
    # ADDED combine command. This merges the parallel data files before reporting.
    coverage combine --rcfile=pyproject.toml
    coverage report --rcfile=pyproject.toml
    coverage xml --rcfile=pyproject.toml
